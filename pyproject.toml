[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Function calling for constrained decoding"
requires-python = ">=3.10"
readme = "README.md"
author = [
    {name = "ckruk"}
]
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]
